<!DOCTYPE html>
<html>
<head>
    <title>Guestbook</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .entry { border-bottom: 1px solid #eee; padding: 12px 0; }
        .meta { color: #777; font-size: 0.9em; }
        .btn { display: inline-block; padding: 8px 16px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>📖 Guestbook</h1>

    <p><a class="btn" href="{% url 'guestbook_add' %}">+ Add your greeting</a></p>
    <p>Total greetings: {{ entries.count }}</p>
    

    {% for entry in entries %}
        <div class="entry">
            <p><strong>{{ entry.name }}</strong>
               <span class="meta">— {{ entry.created_at|date:"M d, Y H:i" }}</span></p>
            <p>{{ entry.message|linebreaks }}</p>

        </div>
        <a href="{% url 'guestbook_delete' entry.id %}">Delete</a>
    {% empty %}
        <p>No greetings yet. Be the first! 🎉</p>
    {% endfor %}

    <p><a href="{% url 'home' %}">← Home</a></p>
</body>
</html>
