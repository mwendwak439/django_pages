<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        nav { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 12px; text-decoration: none; color: #0066cc; }
        nav .user-info { float: right; color: #333; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 8px 16px; background: #0066cc; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .errorlist { color: red; list-style: none; padding: 0; margin: 5px 0; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px; background: #e6f7e6; border-left: 4px solid #2ecc71; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'guestbook_list' %}">Guestbook</a>

        <span class="user-info">
            {% if user.is_authenticated %}
                Hi, <a href="{% url 'profile' %}">{{ user.username }}</a> |
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:#0066cc;cursor:pointer;padding:0;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a> |
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </span>
    </nav>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
