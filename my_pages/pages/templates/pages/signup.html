{% extends 'pages/base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
    <h1>Create an Account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign up</button>
    </form>

    <p class="mt-20">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
