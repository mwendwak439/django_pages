{% extends 'pages/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h1>Login</h1>

    {% if form.errors %}
        <p style="color:red;">Your username and password didn't match. Try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p class="mt-20">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
